name: AI Tests

on:
  push:
    paths:
      - "ai/**"
      - "pytest.ini"
      - ".github/workflows/ai-tests.yml"
  pull_request:
    paths:
      - "ai/**"
      - "pytest.ini"
      - ".github/workflows/ai-tests.yml"

jobs:
  ai-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml torch transformers peft accelerate safetensors trl

      - name: Run AI tests
        run: |
          python -m pytest ai/tests -q
